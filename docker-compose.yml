networks: 
  guessnica: 
    external: true
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8082
    networks:
      - guessnica
